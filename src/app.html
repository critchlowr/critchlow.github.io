<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Safari and iOS don't use SVG tab icons and show a letter instead, so PNG and ICO too. -->
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			(function () {
				const root = document.documentElement;
				// Reveal animations hide content only when this class is present, so the
				// page stays readable if JavaScript never runs.
				root.classList.add('js');
				let saved = null;
				try {
					saved = localStorage.getItem('theme');
				} catch {
					// Storage can be blocked; fall back to the system setting.
				}
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
					root.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-prerender="true">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
