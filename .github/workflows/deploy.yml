name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the checks and the build, but never deploy — see the guards
  # on the deploy job and the artifact upload below.
  pull_request:
    branches: [main]

# Only `contents: read` at workflow level. The tokens that can publish are scoped
# to the deploy job, so a pull request run never holds pages:write.
permissions:
  contents: read

concurrency:
  # Scoped per ref so a pull request cannot queue behind, or hold up, a deploy of
  # main. Superseded PR runs are cancelled; deploys are never cancelled midway.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap gates, no browser required. `check` is what surfaces Svelte's own
      # a11y_* compiler warnings; without it they are only ever seen locally.
      - name: Lint
        run: npm run lint

      - name: Type and a11y check
        run: npm run check

      - name: Contrast tokens
        run: npm run contrast

      - name: Build
        run: npm run build

      # Browser gates against the built site, light and dark. pa11y brings its own
      # Chrome through puppeteer; the axe audit runs on Playwright's Chromium.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: pa11y (WCAG 2 AA, axe + htmlcs)
        run: npm run pa11y

      - name: axe audit, including the simulator dialog
        run: npm run axe

      # Nothing to publish from a pull request, so skip the upload entirely. The
      # steps above have already done the useful work by this point.
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    # The guard that keeps an unreviewed branch off the live site.
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
