name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run every check and the build but never deploy. See the
  # guards on the upload step and the deploy job.
  pull_request:
    branches: [main]

# Read-only by default. Only the deploy job gets pages:write, so a pull request
# run never holds a token that can publish.
permissions:
  contents: read

concurrency:
  # Per ref, so a pull request never queues behind a deploy of main. Superseded
  # PR runs are cancelled; deploys are never cancelled midway.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
# The comment on each line is the release the SHA belongs to.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so do not leave a token in .git/config.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fast gates, no browser needed. `check` also reports Svelte's own a11y_*
      # compiler warnings.
      - name: Lint
        run: npm run lint

      - name: Type and a11y check
        run: npm run check

      # The simulator's rules: waves, picks, shorts, replenishment, packing.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Browser gates against the built site, light and dark. pa11y brings its own
      # Chrome through puppeteer; the axe audit runs on Playwright's Chromium.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: pa11y (WCAG 2 AA, axe + htmlcs)
        run: npm run pa11y

      # Also opens the mobile menu and plays a full simulator shift, auditing
      # each phase of the dialog, since none of that is in the served HTML.
      - name: axe audit, including the simulator dialog
        run: npm run axe

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    # Keeps an unreviewed branch off the live site.
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
