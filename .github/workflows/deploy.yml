name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run every check and the build but never deploy. See the
  # guards on the upload step and the deploy job.
  pull_request:
    branches: [main]

# Read-only by default. Only the deploy job gets pages:write, so a pull request
# run never holds a token that can publish.
permissions:
  contents: read

concurrency:
  # Per ref, so a pull request never queues behind a deploy of main. Superseded
  # PR runs are cancelled; deploys are never cancelled midway.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
# The comment on each line is the release the SHA belongs to.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this job pushes, so do not leave a token in .git/config.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fast gates, no browser needed. `check` also reports Svelte's own a11y_*
      # compiler warnings.
      - name: Lint
        run: npm run lint

      - name: Type and a11y check
        run: npm run check

      - name: Build
        run: npm run build

      # Browser gates against the built site, light and dark. pa11y brings its own
      # Chrome through puppeteer; the axe audit runs on Playwright's Chromium.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: pa11y (WCAG 2 AA, axe + htmlcs)
        run: npm run pa11y

      # Also opens the mobile menu and plays a full simulator shift, auditing
      # each phase of the dialog, since none of that is in the served HTML.
      - name: axe audit, including the simulator dialog
        run: npm run axe

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build

  deploy:
    # Keeps an unreviewed branch off the live site.
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
