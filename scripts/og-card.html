<!doctype html>
<!--
	Source for static/images/og-card.png, the 1200x630 link-preview image. To regenerate,
	run npm install (fonts load from node_modules), open this file in a browser at a
	1200x630 viewport, and screenshot the page.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Fraunces;
				src: url(../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2);
			}
			@font-face {
				font-family: Inter;
				src: url(../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2);
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				position: relative;
				background: #fbf8f1;
				color: #16213a;
				font-family: Inter;
				border-top: 14px solid #1f3d7a;
			}
			.c {
				position: absolute;
				left: 88px;
				top: 120px;
				width: 680px;
			}
			h1 {
				font-family: Fraunces;
				font-size: 92px;
				font-weight: 650;
				letter-spacing: -0.02em;
				line-height: 1;
			}
			.t {
				margin-top: 22px;
				font-size: 32px;
				font-weight: 600;
				color: #1f3d7a;
			}
			.s {
				margin-top: 28px;
				font-size: 27px;
				line-height: 1.45;
				color: #4a5468;
			}
			.u {
				position: absolute;
				left: 88px;
				bottom: 56px;
				font-size: 24px;
				font-weight: 600;
				color: #1f3d7a;
				background: #f7e6b5;
				padding: 6px 14px;
				border-radius: 8px;
			}
			img {
				position: absolute;
				right: 80px;
				bottom: 70px;
				width: 340px;
			}
		</style>
	</head>
	<body>
		<div class="c">
			<h1>Ryan Critchlow</h1>
			<div class="t">Accessibility and UX research · Enterprise technical support</div>
			<div class="s">
				Peer-reviewed research at ASSETS 2026, an M.S. in Computer Science, and three years of
				enterprise WMS support.
			</div>
		</div>
		<div class="u">ryancritchlow.com</div>
		<img src="../static/images/logo-dog.png" alt="" />
	</body>
</html>
