<!doctype html>
<!--
	Source for static/images/og-card.png, the 1200x630 link-preview image. To regenerate,
	run npm install (fonts load from node_modules), open this file in a browser at a
	1200x630 viewport, and screenshot the page.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Fraunces;
				src: url(../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2);
			}
			@font-face {
				font-family: Inter;
				src: url(../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2);
			}
			@font-face {
				font-family: Mono;
				src: url(../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2);
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #fbf9f6;
				font-family: Inter;
				color: #4e4538;
				position: relative;
			}
			.wash {
				position: absolute;
				inset: 0;
				background:
					radial-gradient(
						900px 480px at 8% -15%,
						color-mix(in oklab, #f1ce82 62%, transparent),
						transparent 72%
					),
					radial-gradient(
						760px 460px at 96% 115%,
						color-mix(in oklab, #e4c7e8 60%, transparent),
						transparent 72%
					),
					radial-gradient(
						520px 340px at 72% -6%,
						color-mix(in oklab, #d1f3cb 30%, transparent),
						transparent 70%
					);
			}
			.c {
				position: absolute;
				inset: 0;
				padding: 76px 88px;
				display: flex;
				flex-direction: column;
			}
			.k {
				font-family: Mono;
				font-size: 22px;
				font-weight: 600;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: #6d4e00;
			}
			h1 {
				font-family: Fraunces;
				font-weight: 600;
				font-size: 118px;
				line-height: 1;
				color: #623d19;
				margin-top: 34px;
				letter-spacing: -0.01em;
			}
			.t {
				font-size: 36px;
				font-weight: 500;
				color: #6d4e00;
				margin-top: 26px;
			}
			.rule {
				height: 2px;
				background: #dfd0bc;
				width: 640px;
				margin-top: 40px;
			}
			.s {
				font-size: 25px;
				line-height: 1.45;
				color: #4e4538;
				margin-top: 30px;
				max-width: 660px;
			}
			.u {
				position: absolute;
				left: 88px;
				bottom: 60px;
				font-family: Mono;
				font-size: 24px;
				color: #623d19;
				font-weight: 600;
			}
			img {
				position: absolute;
				right: 70px;
				bottom: 58px;
				width: 400px;
				opacity: 0.9;
			}
		</style>
	</head>
	<body>
		<div class="wash"></div>
		<div class="c">
			<div class="k">Portfolio</div>
			<h1>Ryan Critchlow</h1>
			<div class="t">Product · Research · Enterprise Systems</div>
			<div class="rule"></div>
			<div class="s">
				Enterprise WMS accounts, an M.S. in Computer Science, and peer-reviewed accessibility
				research.
			</div>
		</div>
		<div class="u">ryancritchlow.com</div>
		<img src="../static/images/logo-dog.png" />
	</body>
</html>
