<!doctype html>
<!--
	Source for static/images/og-card.png, the 1200x630 link-preview image. To regenerate,
	run npm install (fonts load from node_modules), then run node scripts/og-card.mjs.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Atkinson;
				font-weight: 200 800;
				src: url(../node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2);
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				position: relative;
				background: #f5f0e6;
				color: #1f170f;
				font-family: Atkinson;
				border-top: 14px solid #3d5a2c;
			}
			.c {
				position: absolute;
				left: 88px;
				top: 120px;
				width: 680px;
			}
			h1 {
				font-size: 96px;
				font-weight: 800;
				letter-spacing: -0.035em;
				line-height: 1;
			}
			.t {
				margin-top: 22px;
				font-size: 36px;
				font-weight: 500;
				color: #2a2017;
			}
			.s {
				margin-top: 28px;
				font-size: 27px;
				line-height: 1.45;
				color: #5a4d3f;
			}
			.u {
				position: absolute;
				left: 88px;
				bottom: 56px;
				font-size: 24px;
				font-weight: 600;
				color: #2a2017;
				background: #edc86a;
				padding: 6px 14px;
				border-radius: 8px;
			}
			img {
				position: absolute;
				right: 80px;
				bottom: 70px;
				width: 340px;
			}
		</style>
	</head>
	<body>
		<div class="c">
			<h1>Ryan Critchlow</h1>
			<div class="t">UX researcher focused on accessibility</div>
			<div class="s">
				Peer-reviewed research presented at ASSETS 2026 and an M.S. in Computer Science
				concentrating in <span style="white-space: nowrap">human-computer interaction</span>.
			</div>
		</div>
		<div class="u">ryancritchlow.com</div>
		<img src="../static/images/logo-dog.png" alt="" />
	</body>
</html>
