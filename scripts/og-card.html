<!doctype html>
<!--
	Source for static/images/og-card.png, the 1200x630 link-preview image, drawn as a
	small version of the board at the top of the main page. To regenerate, run npm
	install (the text font loads from node_modules), then run node scripts/og-card.mjs.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Atkinson;
				font-weight: 200 800;
				src: url(../node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2);
			}
			@font-face {
				font-family: Gabarito;
				font-weight: 600 800;
				src: url(../src/lib/assets/fonts/gabarito-display.woff2);
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				display: grid;
				grid-template-columns: 7fr 4fr;
				grid-template-rows: 1fr 1fr;
				gap: 18px;
				padding: 36px;
				background: #efe4cf;
				color: #2b1e16;
				font-family: Atkinson;
			}
			.tile {
				border-radius: 40px;
				padding: 40px 44px;
			}
			.name {
				grid-row: span 2;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 56px;
				background: #7a2a26;
				color: #fff3e0;
			}
			h1 {
				font-family: Gabarito;
				font-size: 132px;
				font-weight: 800;
				letter-spacing: -0.035em;
				line-height: 0.9;
			}
			.t {
				margin-top: 28px;
				font-family: Gabarito;
				font-size: 40px;
				font-weight: 600;
				line-height: 1.15;
			}
			.u {
				margin-top: 44px;
				font-size: 28px;
				font-weight: 600;
			}
			.paper {
				display: flex;
				flex-direction: column;
				justify-content: center;
				background: #454e22;
				color: #f6f1df;
			}
			.paper b {
				font-family: Gabarito;
				font-size: 38px;
				font-weight: 700;
				line-height: 1.1;
			}
			.paper span {
				margin-top: 14px;
				font-size: 26px;
				line-height: 1.35;
			}
			.lab {
				display: grid;
				place-items: center;
				background: #fbf4e6;
			}
			img {
				width: 290px;
			}
		</style>
	</head>
	<body>
		<div class="tile name">
			<h1>Ryan Critchlow</h1>
			<div class="t">UX researcher focused on accessibility</div>
			<div class="u">ryancritchlow.com</div>
		</div>
		<div class="tile paper">
			<b>Peer-reviewed paper</b>
			<span>Presented at ASSETS 2026</span>
		</div>
		<div class="tile lab"><img src="../static/images/logo-dog.png" alt="" /></div>
	</body>
</html>
